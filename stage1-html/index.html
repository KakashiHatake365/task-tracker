head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 60px 20px; font-family: system-ui, sans-serif; color: #23302b; background: #f3f5f1; }
        main { max-width: 600px; margin: auto; padding: 32px; background: white; border: 1px solid #dce3db; border-radius: 16px; }
        h1 { margin: 0 0 8px; }
        .intro { margin: 0 0 28px; color: #637168; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; min-width: 0; padding: 12px; border: 1px solid #b9c5bb; border-radius: 8px; font: inherit; }
        button { padding: 10px 16px; border: 0; border-radius: 8px; background: #286345; color: white; font: inherit; cursor: pointer; }
        button:hover { background: #1d4d34; }
        :focus-visible { outline: 3px solid #70a98a; outline-offset: 3px; }
        #summary { margin-top: 24px; color: #637168; font-size: .9rem; }
        ul { list-style: none; margin: 0; padding: 0; }
        li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #e7ece6; }
        li label { flex: 1; margin: 0; font-weight: 400; overflow-wrap: anywhere; cursor: pointer; }
        li input { width: 18px; height: 18px; margin: 0; accent-color: #286345; }
        li input:checked + label { text-decoration: line-through; color: #79837d; }
        .delete { padding: 7px 10px; background: #f6eeeb; color: #934834; font-size: .85rem; }
        .delete:hover { background: #eddbd4; }
        #empty { padding: 24px 12px; border: 1px dashed #cdd8cd; border-radius: 8px; text-align: center; color: #637168; }
        #storage-note { color: #934834; font-size: .85rem; }
        [hidden] { display: none; }
        @media (max-width: 420px) { body { padding: 24px 12px; } main { padding: 24px 18px; } .input-row { flex-direction: column; } }
    </style>
</head>
<body>
    <main>
        <p class="intro">A little space to keep your day on track.</p>
        <form id="task-form">
            <label for="task">New task</label>
            <div class="input-row">
                <input type="text" id="task" name="task" placeholder="What needs to get done?" maxlength="200" required>
                <button type="submit">Add task</button>
            </div>
        </form>
        <p id="summary" role="status"></p>
        <ul id="task-list" aria-label="Tasks"></ul>
        <p id="empty">No tasks yet. Add your first one above.</p>
        <p id="storage-note" hidden>Browser storage is unavailable. Your tasks will last for this session only.</p>
    </main>
    <script>
        const form = document.getElementById('task-form');
        const input = document.getElementById('task');
        const list = document.getElementById('task-list');
        const storageKey = 'task-tracker.tasks';
        let tasks = [];

        try {
            const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (Array.isArray(saved)) {
                tasks = saved.filter(task => task && typeof task.text === 'string' && typeof task.done === 'boolean');
            }
        } catch {
            document.getElementById('storage-note').hidden = false;
        }

        function save() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(tasks));
            } catch {
                document.getElementById('storage-note').hidden = false;
            }
        }

        function updateSummary() {
            const remaining = tasks.filter(task => !task.done).length;
            document.getElementById('summary').textContent = `${remaining} ${remaining === 1 ? 'task' : 'tasks'} remaining · ${tasks.length - remaining} completed`;
            document.getElementById('empty').hidden = tasks.length > 0;
        }

        function render() {
            list.replaceChildren();
            tasks.forEach((task, index) => {
                const item = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `task-${index}`;
                checkbox.checked = task.done;
                checkbox.addEventListener('change', () => {
                    task.done = checkbox.checked;
                    save();
                    updateSummary();
                });
                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = task.text;
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'delete';
                remove.textContent = 'Delete';
                remove.setAttribute('aria-label', `Delete task: ${task.text}`);
                remove.addEventListener('click', () => {
                    tasks.splice(index, 1);
                    save();
                    render();
                    const nextButton = list.children[Math.min(index, tasks.length - 1)]?.querySelector('button');
                    (nextButton || input).focus();
                });
                item.append(checkbox, label, remove);
                list.append(item);
            });
            updateSummary();
        }

        form.addEventListener('submit', event => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) {
                input.value = '';
                input.reportValidity();
                return;
            }
            tasks.push({ text, done: false });
            save();
            render();
            form.reset();
            input.focus();
        });
        render();
    </script>
</body>
</html>
