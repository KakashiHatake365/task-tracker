name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flask-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-flask

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: task_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/task_tracker_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-flask/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test tables
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          with psycopg.connect(
              os.environ["TEST_DATABASE_URL"],
              autocommit=True
          ) as connection:
              database = connection.execute(
                  "SELECT current_database()"
              ).fetchone()[0]
              assert database == "task_tracker_test"
              connection.execute(Path("schema.sql").read_text())
          PY

      - name: Run Flask tests
        run: python -m pytest -v --tb=short

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-node

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node API tests
        run: npm test

  react-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Build React
        run: npm run build